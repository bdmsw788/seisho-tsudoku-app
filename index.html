<style>
:root{
  --paper:#F1EBDC;
  --paper-raised:#FBF8F0;
  --paper-sunken:#E5DDC7;
  --ink:#2B2A22;
  --ink-soft:#655F4C;
  --ink-faint:#8B8570;
  --indigo:#2E4459;
  --indigo-soft:#4C6C86;
  --indigo-tint:#DCE4E9;
  --gold:#AC7C24;
  --gold-soft:#D9AE5C;
  --gold-tint:#F3E4C2;
  --sage:#586B49;
  --sage-tint:#DCE4D0;
  --line:rgba(43,42,34,0.15);
  --line-strong:rgba(43,42,34,0.28);
  --shadow:0 1px 2px rgba(43,42,34,0.06),0 6px 20px -8px rgba(43,42,34,0.18);
  --radius:14px;
  --radius-sm:9px;
  --font-display:"Shippori Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --font-accent:"Klee One","Zen Kaku Gothic New",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1C21;
    --paper-raised:#25272F;
    --paper-sunken:#16171B;
    --ink:#ECE6D6;
    --ink-soft:#B7AF98;
    --ink-faint:#7E7869;
    --indigo:#93B2CC;
    --indigo-soft:#6C8CA8;
    --indigo-tint:#293845;
    --gold:#E3B354;
    --gold-soft:#C99433;
    --gold-tint:#3A3223;
    --sage:#9BB587;
    --sage-tint:#2A331F;
    --line:rgba(236,230,214,0.14);
    --line-strong:rgba(236,230,214,0.26);
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 10px 30px -10px rgba(0,0,0,0.55);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1C21;
  --paper-raised:#25272F;
  --paper-sunken:#16171B;
  --ink:#ECE6D6;
  --ink-soft:#B7AF98;
  --ink-faint:#7E7869;
  --indigo:#93B2CC;
  --indigo-soft:#6C8CA8;
  --indigo-tint:#293845;
  --gold:#E3B354;
  --gold-soft:#C99433;
  --gold-tint:#3A3223;
  --sage:#9BB587;
  --sage-tint:#2A331F;
  --line:rgba(236,230,214,0.14);
  --line-strong:rgba(236,230,214,0.26);
  --shadow:0 1px 2px rgba(0,0,0,0.3),0 10px 30px -10px rgba(0,0,0,0.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:inherit;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.icon.filled{fill:currentColor;stroke:none;}

.app{max-width:920px;margin:0 auto;padding:0 20px 80px;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;
  padding:32px 0 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:50%;
  background:var(--indigo);color:var(--paper-raised);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.brand-mark .icon{width:22px;height:22px;}
.brand-text h1{font-size:1.5rem;color:var(--ink);letter-spacing:.02em;}
.brand-text p{font-size:.78rem;color:var(--ink-faint);margin-top:2px;letter-spacing:.05em;}

.plan-tabs{display:flex;flex-wrap:wrap;gap:8px;}
.plan-tab{
  display:flex;align-items:center;gap:7px;
  padding:7px 14px 7px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink-soft);
  font-size:.82rem;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
}
.plan-tab .ring{width:20px;height:20px;flex:none;}
.plan-tab:hover{border-color:var(--line-strong);color:var(--ink);}
.plan-tab.active{background:var(--indigo);border-color:var(--indigo);color:var(--paper-raised);}
.plan-tab.active .ring{color:var(--paper-raised);}
.plan-tab.add{color:var(--indigo);border-style:dashed;background:transparent;}
:root[data-theme="dark"] .plan-tab.add,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plan-tab.add{color:var(--indigo);}}

/* ---------- Onboarding ---------- */
.hero-scene{
  width:100%;height:auto;display:block;border-radius:var(--radius);
  margin-bottom:28px;box-shadow:var(--shadow);background:var(--paper-sunken);
}
.onboarding-intro{margin-bottom:26px;}
.onboarding-intro h2{font-size:1.3rem;margin-bottom:8px;}
.onboarding-intro p{color:var(--ink-soft);max-width:52ch;}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.plan-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:0 0 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);
  cursor:pointer;text-align:left;color:inherit;transition:transform .15s, border-color .15s;
  overflow:hidden;
}
.plan-card:hover{border-color:var(--line-strong);transform:translateY(-2px);}
.plan-card-banner{width:100%;height:96px;display:block;background:var(--paper-sunken);}
.plan-card-banner svg{width:100%;height:100%;display:block;}
.plan-card-body{display:flex;flex-direction:column;gap:12px;padding:16px 20px 0;flex:1;}
.plan-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.plan-card-icon{
  width:40px;height:40px;border-radius:11px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-tint);color:var(--gold);
  margin-top:-38px;border:3px solid var(--paper-raised);
}
.plan-card-icon .icon{width:22px;height:22px;}
.plan-card-badge{
  font-size:.7rem;color:var(--ink-faint);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;white-space:nowrap;letter-spacing:.03em;background:var(--paper-raised);
}
.plan-card-badge.started{color:var(--sage);border-color:var(--sage-tint);background:var(--sage-tint);}
.plan-card h3{font-size:1.12rem;}
.plan-card .subtitle{font-size:.78rem;color:var(--indigo);font-weight:500;letter-spacing:.02em;}
.plan-card .citation,.citation{font-family:var(--font-accent);font-size:.72rem;color:var(--gold);margin-top:3px;display:flex;align-items:center;gap:4px;}
.plan-card .citation .icon,.citation .icon{width:11px;height:11px;}
.plan-card .blurb{font-size:.86rem;color:var(--ink-soft);flex:1;}

(function(){
"use strict";

/* ============================== DATA ============================== */

var OT_BOOKS=[["創世記",50],["出エジプト記",40],["レビ記",27],["民数記",36],["申命記",34],
["ヨシュア記",24],["士師記",21],["ルツ記",4],["サムエル記第一",31],["サムエル記第二",24],
["列王記第一",22],["列王記第二",25],["歴代誌第一",29],["歴代誌第二",36],["エズラ記",10],
["ネヘミヤ記",13],["エステル記",10],["ヨブ記",42],["詩篇",150],["箴言",31],
["伝道者の書",12],["雅歌",8],["イザヤ書",66],["エレミヤ書",52],["哀歌",5],
["エゼキエル書",48],["ダニエル書",12],["ホセア書",14],["ヨエル書",3],["アモス書",9],
["オバデヤ書",1],["ヨナ書",4],["ミカ書",7],["ナホム書",3],["ハバクク書",3],
["ゼパニヤ書",3],["ハガイ書",2],["ゼカリヤ書",14],["マラキ書",4]];

var NT_BOOKS=[["マタイ",28],["マルコ",16],["ルカ",24],["ヨハネ",21],["使徒行伝",28],
["ローマ書",16],["コリント第一",16],["コリント第二",13],["ガラテヤ書",6],["エペソ書",6],
["ピリピ書",4],["コロサイ書",4],["テサロニケ第一",5],["テサロニケ第二",3],["テモテ第一",6],
["テモテ第二",4],["テトス書",3],["ピレモン書",1],["ヘブル書",13],["ヤコブ書",5],
["ペテロ第一",5],["ペテロ第二",3],["ヨハネ第一",5],["ヨハネ第二",1],["ヨハネ第三",1],
["ユダ書",1],["黙示録",22]];

var GOSPELS=[["マタイ",28],["マルコ",16],["ルカ",24],["ヨハネ",21]];
var FULL_BIBLE=OT_BOOKS.concat(NT_BOOKS);

function counterFor(name){ return name==="詩篇" ? "篇" : "章"; }

function flattenBooks(list){
  var flat=[];
  for(var i=0;i<list.length;i++){
    var name=list[i][0], count=list[i][1];
    for(var c=1;c<=count;c++) flat.push([name,c]);
  }
  return flat;
}

function formatRef(book,start,end){
  var suf=counterFor(book);
  return start===end ? (book+" "+start+suf) : (book+" "+start+"-"+end+suf);
}

function formatSlice(slice){
  var refs=[];
  var curBook=slice[0][0], startCh=slice[0][1], endCh=slice[0][1];
  for(var i=1;i<slice.length;i++){
    var b=slice[i][0], c=slice[i][1];
    if(b===curBook && c===endCh+1){ endCh=c; }
    else{
      refs.push(formatRef(curBook,startCh,endCh));
      curBook=b; startCh=c; endCh=c;
    }
  }
  refs.push(formatRef(curBook,startCh,endCh));
  return refs;
}

function buildGeneratedPlan(list,days){
  var flat=flattenBooks(list);
  var total=flat.length;
  var out=[];

var STORAGE_KEY="seisho-tsudoku-niwa-v1";

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){ var s=JSON.parse(raw); if(s && typeof s==="object") return normalizeState(s); }
  }catch(e){}
  return normalizeState({});
}
function normalizeState(s){
  s.active = s.active || null;
  s.plans = s.plans || {};
  s.badges = s.badges || {};
  s.flags = s.flags || {earlybird:false, nightowl:false};
  s.bestStreakEver = s.bestStreakEver || 0;
  s.activity = s.activity || {};
  for(var planId in s.plans){
    var ps=s.plans[planId], plan=PLAN_DEFS[planId];
    if(!ps || !plan) continue;
    ps.completed = ps.completed || {};
    var migrated={};
    for(var key in ps.completed){
      var val=ps.completed[key];
      if(val===true){
        var refs=plan.days[parseInt(key,10)-1]||[];
        var obj={};
        for(var i=0;i<refs.length;i++) obj[i]=true;
        migrated[key]=obj;
      } else if(val && typeof val==="object"){
        migrated[key]=val;
      }
    }
    ps.completed=migrated;
    ps.completedAt = ps.completedAt || {};
  }
  return s;
}
var state = loadState();
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ============================== DATE HELPERS ============================== */

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseIsoDate(str){ var p=str.split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function todayDate(){ var t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function todayStr(){ return isoDate(todayDate()); }

function planDatesArray(plan, startDateStr){
  var start = parseIsoDate(startDateStr);
  var out = new Array(plan.days.length);
  if(plan.schedule==="daily"){
    for(var i=0;i<plan.days.length;i++) out[i]=addDays(start,i);
    return out;
  }
  var d=new Date(start);
  while(d.getDay()===0 || d.getDay()===6) d=addDays(d,1);
  out[0]=new Date(d);
  for(var i2=1;i2<plan.days.length;i2++){
    d=addDays(d,1);
    while(d.getDay()===0 || d.getDay()===6) d=addDays(d,1);
    out[i2]=new Date(d);
  }
  return out;
}

var MONTH_NAMES=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

/* ============================== DERIVED STATS ============================== */

function totalCompletedAllPlans(){
  var t=0;
  for(var id in state.plans){ t += Object.keys(state.plans[id].completed||{}).length; }
  return t;
}
function globalXP(){ return totalCompletedAllPlans()*10; }
function levelFor(xp){
  var cur=LEVELS[0];
  for(var i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].xp) cur=LEVELS[i]; }
  return cur;
}
function nextLevelInfo(xp){
  var lv=levelFor(xp);
  var idx=lv.lv-1;
  if(idx>=LEVELS.length-1) return {cur:lv,next:null,ratio:1};
  var next=LEVELS[idx+1];
  var ratio=(xp-lv.xp)/(next.xp-lv.xp);
  return {cur:lv,next:next,ratio:Math.max(0,Math.min(1,ratio))};
}

function sortedActivityDates(){
  return Object.keys(state.activity).sort();
}
function currentActivityStreak(){
  var t=todayDate();
  var y=addDays(t,-1);
  var cursor;
  if(state.activity[isoDate(t)]) cursor=t;
  else if(state.activity[isoDate(y)]) cursor=y;
  else return 0;
  var streak=0;
  while(state.activity[isoDate(cursor)]){ streak++; cursor=addDays(cursor,-1); }
  return streak;
}
function bestActivityStreak(){
  var dates=sortedActivityDates();
  if(dates.length===0) return 0;
  var best=1, cur=1;
  for(var i=1;i<dates.length;i++){
    var prev=parseIsoDate(dates[i-1]), now=parseIsoDate(dates[i]);
    if(isoDate(addDays(prev,1))===isoDate(now)){ cur++; } else { cur=1; }
    if(cur>best) best=cur;
  }
  return best;
}

function refsForDay(planId, dayIndex){
  var plan=PLAN_DEFS[planId];
  return (plan && plan.days[dayIndex-1]) || [];
}
function doneRefsForDay(planId, dayIndex){
  var ps=state.plans[planId];
  return (ps && ps.completed[dayIndex]) || {};
}
function doneRefCount(planId, dayIndex){
  return Object.keys(doneRefsForDay(planId,dayIndex)).length;
}
function isDayDone(planId, dayIndex){
  var refs=refsForDay(planId,dayIndex);
  if(refs.length===0) return false;
  var done=doneRefsForDay(planId,dayIndex);
  for(var i=0;i<refs.length;i++){ if(!done[i]) return false; }
  return true;
}
function planCompletedCount(planId){
  var ps=state.plans[planId]; if(!ps) return 0;
  var plan=PLAN_DEFS[planId];
  var count=0;
  for(var i=1;i<=plan.days.length;i++){ if(isDayDone(planId,i)) count++; }
  return count;
}
function planRatio(planId){
  var plan=PLAN_DEFS[planId];
  return planCompletedCount(planId)/plan.days.length;
}
function maxPlanRatio(){
  var m=0;
  for(var id in state.plans){ m=Math.max(m, planRatio(id)); }
  return m;
}
function startedPlanCount(){ return Object.keys(state.plans).length; }

function currentScheduledIndex(planId){
  var plan=PLAN_DEFS[planId], ps=state.plans[planId];
  var dates=planDatesArray(plan, ps.startDate);
  var t=todayStr();
  var idx=0;
  for(var i=0;i<dates.length;i++){
    if(isoDate(dates[i])<=t) idx=i+1; else break;
  }
  return idx; /* 1-indexed day number, 0 = not started yet */
}

/* ============================== BADGES ============================== */

function evaluateBadges(){
  var newly=[];
  var checks={
    first: totalCompletedAllPlans()>=1,
    streak7: Math.max(currentActivityStreak(),state.bestStreakEver)>=7,
    streak30: Math.max(currentActivityStreak(),state.bestStreakEver)>=30,
    streak100: Math.max(currentActivityStreak(),state.bestStreakEver)>=100,
    q25: maxPlanRatio()>=0.25,
    half: maxPlanRatio()>=0.5,
    q75: maxPlanRatio()>=0.75,
    complete: maxPlanRatio()>=1,
    twoplans: startedPlanCount()>=2,
    earlybird: !!state.flags.earlybird,
    nightowl: !!state.flags.nightowl
  };
  for(var i=0;i<BADGES.length;i++){
    var b=BADGES[i];
    if(checks[b.id] && !state.badges[b.id]){
      state.badges[b.id]=new Date().toISOString();
      newly.push(b);
    }
  }
  return newly;
}

/* ============================== TOGGLING ============================== */

function markActivity(){
  state.activity[todayStr()]=true;
  state.bestStreakEver=Math.max(state.bestStreakEver, currentActivityStreak(), bestActivityStreak());
}

function markRefEngagement(){
  markActivity();
  var hour=new Date().getHours();
  if(hour<7) state.flags.earlybird=true;
  if(hour>=22) state.flags.nightowl=true;
}

function afterProgressChange(dayJustCompleted, prevXP){
  var newBadges = dayJustCompleted ? evaluateBadges() : [];
  saveState();
  renderDashboard();
  if(dayJustCompleted){
    burstConfetti();
    var lvBefore=levelFor(prevXP), lvAfter=levelFor(globalXP());
    if(lvAfter.lv>lvBefore.lv){
      showToast("レベルアップ！「"+lvAfter.title+"」になりました", true);
    }
    for(var i=0;i<newBadges.length;i++){
      (function(b,delay){
        setTimeout(function(){
          showToast("バッジ獲得：「"+b.title+"」", true);
          burstConfetti();
        }, delay);
      })(newBadges[i], 450+i*650);
    }
  }
}

function toggleRef(planId, dayIndex, refIndex){
  var ps=state.plans[planId];
  if(!ps) return;
  var prevXP=globalXP();
  var wasDayDone = isDayDone(planId, dayIndex);
  ps.completed[dayIndex] = ps.completed[dayIndex] || {};
  var key=String(refIndex);
  var nowSet = !ps.completed[dayIndex][key];
  if(nowSet){
    ps.completed[dayIndex][key]=true;
    ps.completedAt[dayIndex]=new Date().toISOString();
    markRefEngagement();
  } else {
    delete ps.completed[dayIndex][key];
    if(Object.keys(ps.completed[dayIndex]).length===0) delete ps.completed[dayIndex];
  }
  var nowDayDone = isDayDone(planId, dayIndex);
  afterProgressChange(!wasDayDone && nowDayDone, prevXP);
}

function bulkToggleDay(planId, dayIndex){
  var ps=state.plans[planId];
  if(!ps) return;
  var prevXP=globalXP();
  var wasDayDone = isDayDone(planId, dayIndex);
  var refs=refsForDay(planId, dayIndex);
  if(wasDayDone){
    delete ps.completed[dayIndex];
  } else {
    var obj={};
    for(var i=0;i<refs.length;i++) obj[i]=true;
    ps.completed[dayIndex]=obj;
    ps.completedAt[dayIndex]=new Date().toISOString();
    markRefEngagement();
  }
  var nowDayDone = isDayDone(planId, dayIndex);
  afterProgressChange(!wasDayDone && nowDayDone, prevXP);
}

function findFocusDay(planId){
  var plan=PLAN_DEFS[planId], ps=state.plans[planId];
  var todayIdx=currentScheduledIndex(planId);
  if(todayIdx===0) return {status:"future", todayIdx:0};
  var backlog=0, focus=null;
  for(var i=1;i<=todayIdx;i++){
    if(!isDayDone(planId,i)){ if(focus===null) focus=i; backlog++; }
  }
  if(focus===null){
    if(todayIdx>=plan.days.length) return {status:"finished", todayIdx:todayIdx};
    return {status:"caught-up", todayIdx:todayIdx, nextIdx:todayIdx+1};
  }
  return {status:"focus", todayIdx:todayIdx, focus:focus, backlog:backlog};
}

function dayOfYearSeed(){
  var t=todayDate();
  var start=new Date(t.getFullYear(),0,0);
  return Math.floor((t-start)/86400000);
}

function renderTodayCard(){
  var el=document.getElementById("todayCard");
  var planId=state.active, plan=PLAN_DEFS[planId], ps=state.plans[planId];
  var f=findFocusDay(planId);
  var quote=QUOTES[dayOfYearSeed()%QUOTES.length];
  var dates=planDatesArray(plan, ps.startDate);

  var eyebrow = '<div class="eyebrow">'+iconSvg("ic-book")+plan.title+'<span class="eyebrow-citation">'+iconSvg("ic-feather")+plan.citation+'</span></div>';

  var body="";
  if(f.status==="future"){
    body = eyebrow+
      '<h2>まもなく始まります</h2>'+
      '<p class="date-line">'+formatDateJp(dates[0])+' から読み始める予定です</p>';
  } else if(f.status==="finished"){
    body = eyebrow+
      '<h2>すべての予定日を読み終えました</h2>'+
      '<p class="all-caught-up">お疲れさまでした。下の一覧からいつでも読み返せます。</p>';
  } else if(f.status==="caught-up"){
    var nd = dates[f.nextIdx-1];
    body = eyebrow+
      '<h2>今日の分は読み終えています</h2>'+
      '<p class="all-caught-up">次は '+formatDateJp(nd)+'（'+plan.days[f.nextIdx-1].length+'箇所）の予定です</p>';
  } else {
    var idx=f.focus;
    var d=dates[idx-1];
    var refs=plan.days[idx-1];
    var done=doneRefsForDay(planId,idx);
    var doneCount=doneRefCount(planId,idx);
    var isBehind = idx < f.todayIdx || (idx===f.todayIdx && f.backlog>1);
    body = eyebrow+
      '<h2>'+(isBehind ? formatDateJp(d)+"の分" : "今日の通読")+'</h2>'+
      '<p class="date-line">'+formatDateJp(d)+'（'+WD_NAMES[d.getDay()]+'）'+
        (f.backlog>1 ? ' <span class="backlog-note">たまっている分：あと'+(f.backlog-1)+'日</span>' : '')+
      '</p>'+
      '<ul class="refs-list">'+refs.map(function(r,ri){
        var isDone=!!done[ri];
        return '<li class="ref-item'+(isDone?" done":"")+'" data-ref="'+ri+'">'+
          '<span class="ref-check">'+iconSvg("ic-check")+'</span>'+
          '<span class="ref-text">'+r+'</span>'+
        '</li>';
      }).join("")+'</ul>'+
      '<div class="today-actions">'+
        '<span class="today-progress">'+doneCount+' / '+refs.length+' 箇所</span>'+
        (doneCount<refs.length ? '<button class="btn-text" id="markAllBtn">すべてチェック</button>' : '')+
      '</div>';
  }
  body += '<p class="quote-line">'+quote+'</p>';
  el.innerHTML = '<div class="today-card-banner">'+planBannerSvg(planId)+'</div><div class="today-card-body">'+body+'</div>';

  var focusIdx = (f.status==="focus") ? f.focus : null;
  if(focusIdx!==null){
    el.querySelectorAll(".ref-item").forEach(function(item){
      item.addEventListener("click", function(){
        toggleRef(planId, focusIdx, parseInt(this.getAttribute("data-ref"),10));
      });
    });
    var markAllBtn=document.getElementById("markAllBtn");
    if(markAllBtn){
      markAllBtn.addEventListener("click", function(e){
        e.stopPropagation();
        bulkToggleDay(planId, focusIdx);
      });
    }
  }
}

/* ---------- heatmap ---------- */

function renderHeatmap(){
  var el=document.getElementById("heatmapPanel");
  var planId=state.active, plan=PLAN_DEFS[planId], ps=state.plans[planId];
  var dates=planDatesArray(plan, ps.startDate);
  var cols = plan.schedule==="weekday" ? 5 : 7;
  var t=todayStr();

  var rowsHtml="";
  for(var r=0; r*cols<dates.length; r++){
    var startIdx=r*cols;
    var rowDate=dates[startIdx];
    var label=MONTH_NAMES[rowDate.getMonth()]+" "+rowDate.getDate()+"日";
    var cellsHtml="";
    for(var c=0;c<cols;c++){
      var idx=startIdx+c;
      if(idx>=dates.length) break;
      var d=dates[idx];
      var dayNum=idx+1;
      var iso=isoDate(d);
      var cls="hm-cell";
      if(isDayDone(planId,dayNum)) cls+=" done";
      else if(iso<t) cls+=" overdue";
      else if(iso>t) cls+=" future";
      if(iso===t) cls+=" today";
      cellsHtml += '<div class="'+cls+'" data-day="'+dayNum+'" title="'+formatDateJp(d)+'：'+plan.days[idx].join("／")+'"></div>';
    }
    rowsHtml += '<div class="heatmap-row"><span class="row-label">'+label+'</span><div class="heatmap-cells">'+cellsHtml+'</div></div>';
  }

  el.innerHTML =
    panelHead("ic-calendar","スタンプカレンダー")+
    '<div class="heatmap-rows">'+rowsHtml+'</div>'+
    '<div class="heatmap-legend">'+
      '<span><span class="legend-swatch" style="background:var(--sage)"></span>読了</span>'+
      '<span><span class="legend-swatch" style="background:var(--gold-tint);border:1px solid var(--gold-soft)"></span>未読了（予定日超過）</span>'+
      '<span><span class="legend-swatch" style="background:var(--paper-sunken);border:1px solid var(--line)"></span>これから</span>'+
    '</div>';

  el.querySelectorAll(".hm-cell").forEach(function(cell){
    cell.addEventListener("click", function(){
      if(this.classList.contains("future")) return;
      bulkToggleDay(planId, parseInt(this.getAttribute("data-day"),10));
    });
  });
}

/* ---------- agenda ---------- */

function renderAgenda(){
  var el=document.getElementById("agendaPanel");
  var planId=state.active, plan=PLAN_DEFS[planId], ps=state.plans[planId];
  var dates=planDatesArray(plan, ps.startDate);
  var t=todayStr();
  var focusMonthKey = null;
  for(var i=0;i<dates.length;i++){
    var iso=isoDate(dates[i]);
    if(iso<=t) focusMonthKey = dates[i].getFullYear()+"-"+pad2(dates[i].getMonth()+1);
  }
  if(focusMonthKey===null) focusMonthKey = dates.length ? (dates[0].getFullYear()+"-"+pad2(dates[0].getMonth()+1)) : null;

  var months=[]; var monthIndex={};
  for(var i2=0;i2<dates.length;i2++){
    var d=dates[i2];
    var key=d.getFullYear()+"-"+pad2(d.getMonth()+1);
    if(!(key in monthIndex)){ monthIndex[key]=months.length; months.push({key:key,year:d.getFullYear(),month:d.getMonth(),rows:[]}); }
    months[monthIndex[key]].rows.push(i2);
  }

  var html=panelHead("ic-book","全日程リスト");
  for(var m=0;m<months.length;m++){
    var mo=months[m];
    var doneCount=0;
    for(var k=0;k<mo.rows.length;k++){ if(isDayDone(planId,mo.rows[k]+1)) doneCount++; }
    var openAttr = mo.key===focusMonthKey ? " open" : "";
    html += '<details class="agenda-month"'+openAttr+'>'+
      '<summary>'+mo.year+'年 '+MONTH_NAMES[mo.month]+'<span class="m-count">'+doneCount+' / '+mo.rows.length+'</span></summary>'+
      '<div class="agenda-rows">';
    for(var k2=0;k2<mo.rows.length;k2++){
      var idx=mo.rows[k2];
      var dayNum=idx+1;
      var d2=dates[idx];
      var refs=plan.days[idx];
      var done=doneRefsForDay(planId,dayNum);
      var dCount=doneRefCount(planId,dayNum);
      html += '<div class="agenda-day">'+
        '<div class="agenda-day-head" data-day="'+dayNum+'">'+
          '<span class="agenda-date">'+(d2.getMonth()+1)+"/"+d2.getDate()+' ('+WD_NAMES[d2.getDay()]+')</span>'+
          '<span class="agenda-day-progress'+(dCount===refs.length?" done":"")+'">'+dCount+' / '+refs.length+'</span>'+
        '</div>'+
        '<div class="agenda-refrows">'+
          refs.map(function(r,ri){
            var isDone=!!done[ri];
            return '<div class="agenda-ref-row'+(isDone?" done":"")+'" data-day="'+dayNum+'" data-ref="'+ri+'">'+
              '<span class="agenda-check">'+iconSvg("ic-check")+'</span>'+
              '<span class="agenda-ref-text">'+r+'</span>'+
            '</div>';
          }).join("")+
        '</div>'+
      '</div>';
    }
    html += '</div></details>';
  }
  el.innerHTML=html;

  el.querySelectorAll(".agenda-ref-row").forEach(function(row){
    row.addEventListener("click", function(){
      toggleRef(planId, parseInt(this.getAttribute("data-day"),10), parseInt(this.getAttribute("data-ref"),10));
    });
  });
  el.querySelectorAll(".agenda-day-progress").forEach(function(badge){
    badge.addEventListener("click", function(){
      bulkToggleDay(planId, parseInt(this.parentElement.getAttribute("data-day"),10));
    });
  });
}

function showToast(text, isBadge){
  var layer=document.getElementById("toastLayer");
  var t=document.createElement("div");
  t.className="toast"+(isBadge?" badge-toast":"");
  t.textContent=text;
  layer.appendChild(t);
  setTimeout(function(){
    t.style.transition="opacity .4s ease";
    t.style.opacity="0";
    setTimeout(function(){ t.remove(); }, 400);
  }, 2600);
}

var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var confettiCanvas=document.getElementById("confettiCanvas");
var cctx=confettiCanvas.getContext("2d");
var confettiParticles=[];
var confettiRunning=false;
function resizeCanvas(){ confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight; }
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

var CONFETTI_COLORS=["#AC7C24","#D9AE5C","#586B49","#2E4459","#8B8570"];
function burstConfetti(){
  if(reduceMotion) return;
  var cx=window.innerWidth/2, cy=window.innerHeight*0.35;
  for(var i=0;i<46;i++){
    confettiParticles.push({
      x:cx+(Math.random()-0.5)*120, y:cy,
      vx:(Math.random()-0.5)*6, vy:-(Math.random()*6+3),
      size:4+Math.random()*4, color:CONFETTI_COLORS[i%CONFETTI_COLORS.length],
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3, life:0
    });
  }
  if(!confettiRunning){ confettiRunning=true; requestAnimationFrame(stepConfetti); }
}
function stepConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  var alive=[];
  for(var i=0;i<confettiParticles.length;i++){
    var p=confettiParticles[i];
    p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    if(p.y < confettiCanvas.height+20 && p.life<260){
      alive.push(p);
      cctx.save();
      cctx.translate(p.x,p.y); cctx.rotate(p.rot);
      cctx.fillStyle=p.color;
      cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      cctx.restore();
    }
  }
  confettiParticles=alive;
  if(confettiParticles.length>0){ requestAnimationFrame(stepConfetti); }
  else { confettiRunning=false; cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
}

/* ============================== INIT ============================== */

showView(state.active ? "dashboard" : "onboarding");

})();
</script>
